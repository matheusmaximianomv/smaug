name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Os quatro lockfiles são independentes (raiz, server, web e e2e): o cache
      # precisa invalidar quando qualquer um deles mudar.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências (raiz, server, web e e2e)
        run: npm run install:all

      # Lint, typecheck e testes rodam contra o client SQLite.
      - name: Gerar o client do Prisma (SQLite)
        run: npm run --prefix server prisma:generate
        env:
          DATABASE_PROVIDER: sqlite

      - name: Lint
        run: npm run lint

      - name: Typecheck (server)
        run: npm run --prefix server typecheck

      - name: Typecheck (web)
        run: npm run --prefix web typecheck

      - name: Typecheck (e2e)
        run: npm run --prefix e2e typecheck

      # Regras de arquitetura: Clean Architecture no server e as proibições de
      # import cruzado entre server/, web/ e e2e/.
      - name: Validar regras de dependência
        run: npm run validate:deps

      # Os testes de integração do server criam os próprios arquivos SQLite via
      # `prisma db push`, então não há banco a provisionar aqui.
      - name: Testes (server e web)
        run: npm test

  migrations:
    name: Migrations (SQLite e PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Banco sombra do dialeto PostgreSQL: o `migrate diff` o apaga e reaplica as
    # migrations nele a cada verificação.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smaug_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências (server)
        run: npm ci --prefix server

      # Falha se as pastas prisma/sqlite/migrations e prisma/postgresql/migrations
      # divergirem entre si ou se alguma não reproduzir prisma/schema.prisma.
      - name: Verificar paridade e fidelidade das migrations
        run: npm run --prefix server migrate:check
        env:
          POSTGRES_SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smaug_shadow
