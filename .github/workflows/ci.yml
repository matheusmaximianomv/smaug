name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Os quatro lockfiles são independentes (raiz, server, web e e2e): o cache
      # precisa invalidar quando qualquer um deles mudar.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências (raiz, server, web e e2e)
        run: npm ci && npm ci --prefix server && npm ci --prefix web && npm ci --prefix e2e

      # Lint, typecheck e testes rodam contra o client SQLite.
      - name: Gerar o client do Prisma (SQLite)
        run: npm run --prefix server prisma:generate
        env:
          DATABASE_PROVIDER: sqlite

      - name: Lint
        run: npm run lint

      - name: Typecheck (server)
        run: npm run --prefix server typecheck

      - name: Typecheck (web)
        run: npm run --prefix web typecheck

      - name: Typecheck (e2e)
        run: npm run --prefix e2e typecheck

      # Regras de arquitetura: Clean Architecture no server e as proibições de
      # import cruzado entre server/, web/ e e2e/.
      - name: Validar regras de dependência
        run: npm run validate:deps

      # Os testes de integração do server criam os próprios arquivos SQLite via
      # `prisma db push`, então não há banco a provisionar aqui.
      - name: Testes (server e web)
        run: npm test
        # Segredos FIXOS de teste, públicos de propósito: não protegem nada e não devem
        # ser usados em nenhum ambiente real. O env.ts da API os exige no import.
        env:
          JWT_SECRET: dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LXNlY3JldCE=
          JWT_KEY_ID: test
          PASSWORD_PEPPERS: test:dGVzdC1vbmx5LXBlcHBlci1ub3QtYS1zZWNyZXQhISE=
          PASSWORD_PEPPER_CURRENT_ID: test

  migrations:
    name: Migrations (SQLite e PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Banco sombra do dialeto PostgreSQL: o `migrate diff` o apaga e reaplica as
    # migrations nele a cada verificação.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smaug_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências (server)
        run: npm ci --prefix server

      # Falha se as pastas prisma/sqlite/migrations e prisma/postgresql/migrations
      # divergirem entre si ou se alguma não reproduzir prisma/schema.prisma.
      - name: Verificar paridade e fidelidade das migrations
        run: npm run --prefix server migrate:check
        env:
          POSTGRES_SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smaug_shadow

      # A rotação de refresh token depende do modelo de concorrência do banco: a mesma
      # bateria que roda em SQLite no job `verify` roda aqui contra PostgreSQL real. O
      # client gerado é de um provider por vez, por isso o client PostgreSQL só existe
      # neste job. O banco `smaug_test` é separado do sombra (que o migrate:check apaga)
      # e é criado pelo `migrate deploy` do próprio teste.
      - name: Gerar o client do Prisma (PostgreSQL)
        run: npm run --prefix server prisma:generate
        env:
          DATABASE_PROVIDER: postgresql

      - name: Concorrência da rotação de refresh token (PostgreSQL)
        working-directory: server
        run: npx vitest run tests/integration/infrastructure/database/repositories/prisma-auth-session.concurrency.test.ts
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smaug_test
